<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>植物大战僵尸 · 极简版</title>
<style>
  html,body{margin:0;height:100%;background:radial-gradient(1200px 700px at 50% -10%,#2f5d22,#16290f 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;user-select:none;overflow:hidden}
  h1{color:#ffe98a;font-size:20px;letter-spacing:4px;margin:0;text-shadow:0 2px 0 #5a3a12,0 4px 10px rgba(0,0,0,.5)}
  canvas{border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 6px #3d2a16,0 0 0 9px #1f1408;cursor:pointer}
  .tip{color:#cfe3b8;font-size:13px;opacity:.85}
</style>
</head>
<body>
<h1>植 物 大 战 僵 尸</h1>
<canvas id="game" width="900" height="600"></canvas>
<div class="tip">点卡片选植物 → 点草坪种下　｜　点天上掉的阳光收集　｜　数字键 1-5 快速选卡，Esc 取消</div>
<script>
(() => {
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ---------- 常量 ----------
const W = 900, H = 600;
const TOP = 86, GX = 84, GY = 96, CW = 90, CH = 96, COLS = 9, ROWS = 5;
const FLAG_T = 95, FINAL_T = 165;            // 大波 / 最终波 时间(秒)
const colX = c => GX + c * CW + CW / 2;
const rowY = r => GY + r * CH + CH / 2;

const PDEF = {
  sunflower:  { name: '向日葵',   cost: 50,  cd: 5,  hp: 90  },
  peashooter: { name: '豌豆射手', cost: 100, cd: 5,  hp: 100 },
  snowpea:    { name: '寒冰射手', cost: 175, cd: 6,  hp: 100 },
  wallnut:    { name: '坚果墙',   cost: 50,  cd: 20, hp: 600 },
  cherry:     { name: '樱桃炸弹', cost: 150, cd: 30, hp: 100 },
};
const ORDER = ['sunflower', 'peashooter', 'snowpea', 'wallnut', 'cherry'];

// ---------- 游戏状态 ----------
let G;
function initGame() {
  G = {
    state: 'ready', time: 0, sun: 75,
    plants: [], zombies: [], peas: [], suns: [], parts: [], floaters: [], booms: [],
    mowers: Array.from({ length: ROWS }, (_, r) => ({ row: r, x: GX - 40, used: false, running: false })),
    cooldown: {}, selected: null, shovel: false,
    skyTimer: 6, spawnIn: 14, finalWave: false,
    queue: buildQueue(), hover: { x: -1, y: -1 }, danger: 0,
  };
}
function buildQueue() {
  const q = [];
  for (let i = 0; i < 6; i++) q.push({ at: FLAG_T + i * 0.9, type: i < 2 ? 'cone' : 'normal' });
  for (let i = 0; i < 12; i++) q.push({ at: FINAL_T + i * 0.7, type: i % 3 === 0 ? 'bucket' : (i % 3 === 1 ? 'cone' : 'normal') });
  return q.sort((a, b) => a.at - b.at);
}

// ---------- 音效（纯 WebAudio，无外部资源） ----------
let AC = null;
function beep(f, d, type = 'sine', v = 0.07, slide = 0) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, AC.currentTime + d);
    g.gain.setValueAtTime(v, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}
function boomSfx() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const len = AC.sampleRate * 0.4, buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 500; g.gain.value = 0.25;
    src.buffer = buf; src.connect(f); f.connect(g); g.connect(AC.destination); src.start();
  } catch (e) {}
}

// ---------- 实体生成 ----------
function spawnZombie(type, row) {
  const hp = type === 'bucket' ? 560 : type === 'cone' ? 270 : 100;
  G.zombies.push({ type, row, x: W + 40, y: rowY(row), hp, maxHp: hp,
    speed: 12 + Math.random() * 4, slowUntil: 0, bite: 0, phase: Math.random() * 6, flash: 0, dead: false });
}
function spawnRandomZombie() {
  const t = G.time, r = Math.random();
  let type = 'normal';
  if (t >= 120) type = r < 0.4 ? 'bucket' : r < 0.7 ? 'cone' : 'normal';
  else if (t >= 70) type = r < 0.15 ? 'bucket' : r < 0.45 ? 'cone' : 'normal';
  else if (t >= 30 && r < 0.25) type = 'cone';
  spawnZombie(type, Math.floor(Math.random() * ROWS));
}
function dropSun(x, y, fromPlant) {
  G.suns.push({ x, y: fromPlant ? y - 20 : y, startY: fromPlant ? y - 20 : y, ty: y, vx: 0, vy: fromPlant ? -55 : 70,
    life: 11, value: 25, plant: !!fromPlant, settled: !fromPlant });
}
function addParts(x, y, color, n, spd = 90) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (0.4 + Math.random() * 0.8);
    G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30,
      life: 0.5 + Math.random() * 0.4, max: 0.9, color, r: 2 + Math.random() * 3 });
  }
}

// ---------- 更新逻辑 ----------
function update(dt) {
  if (G.state !== 'playing') return;
  G.time += dt;
  G.danger = Math.max(0, G.danger - dt);
  for (const k in G.cooldown) G.cooldown[k] = Math.max(0, G.cooldown[k] - dt);

  // 天降阳光
  G.skyTimer -= dt;
  if (G.skyTimer <= 0) {
    dropSun(GX + 40 + Math.random() * (COLS * CW - 80), GY + 50 + Math.random() * (ROWS * CH - 100), false);
    G.skyTimer = 9;
  }

  // 出怪导演
  if (G.time < FINAL_T) {
    G.spawnIn -= dt;
    if (G.spawnIn <= 0) {
      spawnRandomZombie();
      G.spawnIn = Math.max(4, 10 - G.time * 0.035);
    }
  }
  while (G.queue.length && G.time >= G.queue[0].at) spawnZombie(G.queue.shift().type, Math.floor(Math.random() * ROWS));
  if (G.time >= FINAL_T) G.finalWave = true;

  updatePlants(dt);
  updateZombies(dt);
  updatePeas(dt);
  updateMowers(dt);
  updateMisc(dt);

  if (G.finalWave && !G.queue.length && !G.zombies.length) G.state = 'won';
}

function updatePlants(dt) {
  for (const p of G.plants) {
    p.age += dt;
    if (p.hp <= 0) continue;
    if (p.type === 'sunflower') {
      p.timer -= dt;
      if (p.timer <= 0) { dropSun(p.x, p.y - 10, true); p.timer = 16; }
    } else if (p.type === 'peashooter' || p.type === 'snowpea') {
      p.timer -= dt;
      const target = G.zombies.some(z => !z.dead && z.row === p.row && z.x > p.x - 20);
      if (target && p.timer <= 0) {
        G.peas.push({ row: p.row, x: p.x + 26, y: p.y - 8, slow: p.type === 'snowpea', dmg: 25 });
        p.timer = 1.45;
        beep(520, 0.06, 'square', 0.025);
      }
    } else if (p.type === 'cherry') {
      p.fuse -= dt;
      if (p.fuse <= 0) {
        G.booms.push({ x: p.x, y: p.y, r: 0, life: 0.5, max: 0.5 });
        boomSfx();
        for (const z of G.zombies) {
          if (Math.abs(z.row - p.row) <= 1 && Math.abs(z.x - p.x) < CW * 1.55) {
            z.hp -= 1800; z.flash = 0.12;
          }
        }
        addParts(p.x, p.y, '#ff7a2e', 26, 170);
        p.hp = 0;
      }
    }
  }
  G.plants = G.plants.filter(p => p.hp > 0);
}

function updateZombies(dt) {
  const now = G.time;
  for (const z of G.zombies) {
    z.flash = Math.max(0, z.flash - dt);
    z.phase += dt * 3;
    // 找啃食目标
    let target = null;
    for (const p of G.plants) {
      if (p.row === z.row && p.x < z.x + 16 && p.x > z.x - 46) { target = p; break; }
    }
    if (target) {
      z.bite -= dt;
      if (z.bite <= 0) {
        target.hp -= 30; z.bite = 0.6;
        addParts(target.x, target.y + 6, '#7fbf5a', 5, 55);
      }
    } else {
      const slow = now < z.slowUntil ? 0.5 : 1;
      z.x -= z.speed * slow * dt;
    }
    // 小推车 / 进房子
    if (z.x < GX - 8) {
      const m = G.mowers[z.row];
      if (m && !m.used) m.running = true, m.used = true;
      if ((!m || m.used) && z.x < GX - 50 && G.state === 'playing') {
        G.state = 'lost'; beep(110, 1.2, 'sawtooth', 0.2, 40);
      }
      if (m && m.running) m._danger = true;
    }
    if (z.x < GX + 10) G.danger = 0.5;
  }
  G.zombies = G.zombies.filter(z => {
    if (z.hp <= 0) { addParts(z.x, z.y - 4, '#9ab07a', 10, 100); return false; }
    return true;
  });
}

function updatePeas(dt) {
  for (const pea of G.peas) {
    pea.x += 430 * dt;
    for (const z of G.zombies) {
      if (!z.dead && z.row === pea.row && Math.abs(z.x - pea.x) < 24 && Math.abs(z.y - pea.y) < 46) {
        z.hp -= pea.dmg; z.flash = 0.09;
        if (pea.slow) z.slowUntil = G.time + 3;
        pea.hit = true;
        addParts(pea.x, pea.y, pea.slow ? '#9fe4ff' : '#bfe88a', 4, 50);
        break;
      }
    }
  }
  G.peas = G.peas.filter(p => !p.hit && p.x < W + 20);
}

function updateMowers(dt) {
  for (const m of G.mowers) {
    if (!m.running) continue;
    m.x += 380 * dt;
    for (const z of G.zombies) {
      if (z.row === m.row && Math.abs(z.x - m.x) < 42) { z.hp = 0; addParts(z.x, z.y, '#caa46a', 8, 120); }
    }
  }
}

function updateMisc(dt) {
  for (const s of G.suns) {
    s.life -= dt;
    if (s.plant && !s.settled) {       // 植物阳光：先上冒
      s.y += s.vy * dt;
      if (s.y <= s.startY - 26) s.settled = true;
    } else if (!s.plant && s.y < s.ty) {
      s.y = Math.min(s.ty, s.y + s.vy * dt);
    }
  }
  G.suns = G.suns.filter(s => s.life > 0);
  for (const p of G.parts) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 220 * dt;
  }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const f of G.floaters) { f.life -= dt; f.y -= 34 * dt; }
  G.floaters = G.floaters.filter(f => f.life > 0);
  for (const b of G.booms) {
    b.life -= dt;
    b.r = CW * 1.6 * (1 - b.life / b.max);
  }
  G.booms = G.booms.filter(b => b.life > 0);
}

// ---------- 种植 / 交互 ----------
function cellAt(x, y) {
  const c = Math.floor((x - GX) / CW), r = Math.floor((y - GY) / CH);
  return (c >= 0 && c < COLS && r >= 0 && r < ROWS) ? { c, r } : null;
}
function plantAt(r, c) { return G.plants.find(p => p.row === r && p.col === c) || null; }

function tryPlant(type, r, c) {
  const def = PDEF[type];
  if (G.sun < def.cost || (G.cooldown[type] || 0) > 0 || plantAt(r, c)) return false;
  G.sun -= def.cost;
  G.cooldown[type] = def.cd;
  G.plants.push({ type, row: r, col: c, x: colX(c), y: rowY(r) + 10,
    hp: def.hp, maxHp: def.hp, timer: type === 'sunflower' ? 7 : 1.4,
    fuse: type === 'cherry' ? 0.7 : 0, age: 0 });
  beep(150, 0.12, 'sine', 0.12, 70);
  addParts(colX(c), rowY(r) + 30, '#8fd159', 8, 70);
  return true;
}

// 卡片布局
const cardRects = ORDER.map((t, i) => ({ x: 96 + i * 80, y: 8, w: 74, h: 72 }));
const SHOVEL_RECT = { x: 502, y: 12, w: 52, h: 64 };
const BAR = { x: 576, y: 30, w: 306, h: 18 };

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  G.hover.x = (e.clientX - rect.left) * W / rect.width;
  G.hover.y = (e.clientY - rect.top) * H / rect.height;
});

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * W / rect.width;
  const y = (e.clientY - rect.top) * H / rect.height;

  if (G.state === 'ready') {
    if (inRect(x, y, { x: W / 2 - 110, y: 402, w: 220, h: 54 })) { G.state = 'playing'; beep(440, 0.15, 'triangle', 0.1); }
    return;
  }
  if (G.state === 'won' || G.state === 'lost') {
    if (inRect(x, y, { x: W / 2 - 110, y: 380, w: 220, h: 54 })) { initGame(); G.state = 'playing'; }
    return;
  }

  // 1) 收集阳光（优先）
  for (let i = G.suns.length - 1; i >= 0; i--) {
    const s = G.suns[i];
    if (Math.hypot(s.x - x, s.y - y) < 30) {
      G.sun += s.value;
      G.floaters.push({ x: s.x, y: s.y, text: '+25', life: 0.8, color: '#ffe066' });
      G.suns.splice(i, 1);
      beep(880, 0.09, 'triangle', 0.08);
      return;
    }
  }
  // 2) 卡片
  for (let i = 0; i < cardRects.length; i++) {
    if (inRect(x, y, cardRects[i])) {
      const t = ORDER[i];
      if (G.sun >= PDEF[t].cost && (G.cooldown[t] || 0) <= 0) {
        G.selected = G.selected === t ? null : t;
        G.shovel = false;
      } else beep(180, 0.1, 'square', 0.05);
      return;
    }
  }
  // 3) 铲子
  if (inRect(x, y, SHOVEL_RECT)) { G.shovel = !G.shovel; G.selected = null; return; }

  // 4) 草坪
  const cell = cellAt(x, y);
  if (cell) {
    if (G.shovel) {
      const p = plantAt(cell.r, cell.c);
      if (p) { G.plants = G.plants.filter(q => q !== p); addParts(p.x, p.y, '#8fd159', 8, 70); beep(300, 0.1, 'triangle', 0.07); }
      return;
    }
    if (G.selected) {
      if (tryPlant(G.selected, cell.r, cell.c)) G.selected = null;
      return;
    }
  }
  G.selected = null; G.shovel = false;
});

window.addEventListener('keydown', e => {
  if (G.state !== 'playing') return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= ORDER.length) {
    const t = ORDER[n - 1];
    if (G.sun >= PDEF[t].cost && (G.cooldown[t] || 0) <= 0) { G.selected = t; G.shovel = false; }
  }
  if (e.key === 'Escape') { G.selected = null; G.shovel = false; }
});

function inRect(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

// ---------- 绘制 ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }

function draw() {
  drawLawn();
  for (const m of G.mowers) if (!m.used || m.running) drawMower(m);
  for (const p of G.plants) drawPlant(p);
  for (const z of G.zombies) drawZombie(z);
  for (const p of G.peas) drawPea(p);
  for (const b of G.booms) drawBoom(b);
  drawSuns();
  drawParts();
  drawHover();
  drawTopBar();
  if (G.danger > 0) drawDanger();
  if (G.state !== 'playing') drawOverlay();
}

function drawLawn() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#2c4a1c'; ctx.fillRect(0, GY, W, H - GY);
  // 左侧房子危险区
  const grad = ctx.createLinearGradient(0, GY, GX, GY);
  grad.addColorStop(0, '#5b3a22'); grad.addColorStop(1, '#7d5433');
  ctx.fillStyle = grad; ctx.fillRect(0, GY, GX, ROWS * CH);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(GX - 8, GY, 8, ROWS * CH);
  // 草坪棋盘
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    ctx.fillStyle = (r + c) % 2 ? '#8fc24e' : '#9ccb57';
    ctx.fillRect(GX + c * CW, GY + r * CH, CW, CH);
  }
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  ctx.fillRect(GX, GY + ROWS * CH - 10, COLS * CW, 10);
  ctx.fillStyle = 'rgba(255,255,255,.06)';
  ctx.fillRect(GX, GY, COLS * CW, 6);
}

function drawHover() {
  if (G.state !== 'playing' || (!G.selected && !G.shovel)) return;
  const cell = cellAt(G.hover.x, G.hover.y);
  if (!cell) return;
  const occupied = !!plantAt(cell.r, cell.c);
  const ok = G.shovel ? occupied : (!occupied && G.sun >= PDEF[G.selected].cost);
  ctx.fillStyle = ok ? 'rgba(255,255,255,.28)' : 'rgba(220,40,40,.32)';
  ctx.fillRect(GX + cell.c * CW + 3, GY + cell.r * CH + 3, CW - 6, CH - 6);
}

// ----- 植物造型（以 x,y 为中心，s 为缩放） -----
function plantShape(type, x, y, s, t) {
  if (type === 'sunflower') {
    ctx.strokeStyle = '#3e8e36'; ctx.lineWidth = 6 * s;
    ctx.beginPath(); ctx.moveTo(x, y + 14 * s); ctx.lineTo(x, y + 42 * s); ctx.stroke();
    ctx.fillStyle = '#4ea73f';
    ctx.save(); ctx.translate(x - 2 * s, y + 30 * s); ctx.rotate(-0.5);
    ctx.beginPath(); ctx.ellipse(0, 0, 12 * s, 5 * s, 0, 0, 7); ctx.fill(); ctx.restore();
    const wob = Math.sin(t * 1.8) * 0.07;
    for (let i = 0; i < 12; i++) {
      const a = wob + i * Math.PI / 6;
      ctx.save(); ctx.translate(x, y); ctx.rotate(a);
      ctx.fillStyle = '#ffd84a'; ctx.strokeStyle = '#e39a17'; ctx.lineWidth = 1.5 * s;
      ctx.beginPath(); ctx.ellipse(0, -19 * s, 6 * s, 11 * s, 0, 0, 7); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = '#7c4a21'; ctx.beginPath(); ctx.arc(x, y, 14 * s, 0, 7); ctx.fill();
    faceEyes(x - 5 * s, x + 5 * s, y - 2 * s, 2.2 * s);
    ctx.strokeStyle = '#3a2110'; ctx.lineWidth = 1.6 * s;
    ctx.beginPath(); ctx.arc(x, y + 2 * s, 6 * s, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  } else if (type === 'peashooter' || type === 'snowpea') {
    const snow = type === 'snowpea';
    const head = snow ? '#8fdcf0' : '#5dbd42', dark = snow ? '#3597b8' : '#3f9a2b';
    ctx.strokeStyle = '#3e8e36'; ctx.lineWidth = 6 * s;
    ctx.beginPath(); ctx.moveTo(x, y + 12 * s); ctx.lineTo(x, y + 42 * s); ctx.stroke();
    ctx.fillStyle = '#4ea73f';
    ctx.save(); ctx.translate(x - 4 * s, y + 28 * s); ctx.rotate(-0.4);
    ctx.beginPath(); ctx.ellipse(0, 0, 12 * s, 5 * s, 0, 0, 7); ctx.fill(); ctx.restore();
    // 炮管
    ctx.fillStyle = dark; rr(x + 6 * s, y - 7 * s, 24 * s, 13 * s, 6 * s); ctx.fill();
    ctx.fillStyle = '#1d3a16'; circ(x + 28 * s, y - 0.5 * s, 4.5 * s); ctx.fill();
    // 头
    ctx.fillStyle = head; circ(x, y - 4 * s, 17 * s); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 2 * s; ctx.stroke();
    ctx.fillStyle = '#fff'; circ(x + 2 * s, y - 9 * s, 5.5 * s); ctx.fill();
    ctx.fillStyle = '#222'; circ(x + 4 * s, y - 9 * s, 2.6 * s); ctx.fill();
    ctx.strokeStyle = '#26541c'; ctx.lineWidth = 2.2 * s;
    ctx.beginPath(); ctx.moveTo(x - 4 * s, y - 15 * s); ctx.lineTo(x + 8 * s, y - 13 * s); ctx.stroke();
  } else if (type === 'wallnut') {
    ctx.fillStyle = '#caa062';
    ctx.beginPath(); ctx.ellipse(x, y + 6 * s, 18 * s, 24 * s, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#8a5f30'; ctx.lineWidth = 2.5 * s; ctx.stroke();
    ctx.fillStyle = 'rgba(120,70,20,.18)';
    ctx.beginPath(); ctx.ellipse(x, y + 14 * s, 12 * s, 12 * s, 0, 0, 7); ctx.fill();
    faceEyes(x - 6 * s, x + 6 * s, y - 2 * s, 2.6 * s);
    ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 2 * s;
    ctx.beginPath(); ctx.arc(x, y + 9 * s, 5 * s, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  } else if (type === 'cherry') {
    ctx.strokeStyle = '#4f7a2c'; ctx.lineWidth = 2.5 * s;
    ctx.beginPath(); ctx.moveTo(x - 8 * s, y - 10 * s); ctx.quadraticCurveTo(x, y - 26 * s, x + 8 * s, y - 12 * s); ctx.stroke();
    ctx.fillStyle = '#5ea83a';
    ctx.beginPath(); ctx.ellipse(x + 2 * s, y - 22 * s, 8 * s, 4 * s, -0.4, 0, 7); ctx.fill();
    for (const [cx, cy] of [[-9, 4], [8, 6]]) {
      ctx.fillStyle = '#e0322f'; circ(x + cx * s, y + cy * s, 13 * s); ctx.fill();
      ctx.strokeStyle = '#a41616'; ctx.lineWidth = 1.6 * s; ctx.stroke();
      ctx.fillStyle = '#fff'; circ(x + (cx - 3) * s, y + (cy - 4) * s, 2.6 * s); ctx.fill();
      ctx.fillStyle = '#222'; circ(x + (cx - 2) * s, y + (cy - 4) * s, 1.3 * s); ctx.fill();
    }
  }
}
function faceEyes(lx, rx, y, r) {
  ctx.fillStyle = '#fff'; circ(lx, y, r + 0.8); circ(rx, y, r + 0.8); ctx.fill();
  ctx.fillStyle = '#222'; circ(lx + 0.8, y, r * 0.5); circ(rx + 0.8, y, r * 0.5); ctx.fill();
}

function drawPlant(p) {
  const pop = Math.min(1, p.age * 4);
  const s = 1.18 * (0.6 + 0.4 * pop);
  // 影子
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y + 38, 22, 7, 0, 0, 7); ctx.fill();
  ctx.save();
  if (p.type === 'cherry' && p.fuse < 0.35 && Math.floor(p.fuse * 14) % 2 === 0) ctx.globalAlpha = 0.75;
  plantShape(p.type, p.x, p.y, s, G.time);
  ctx.restore();
  // 坚果裂纹（随血量）
  if (p.type === 'wallnut') {
    const ratio = p.hp / p.maxHp;
    if (ratio < 0.66) {
      ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p.x - 8, p.y - 14); ctx.lineTo(p.x - 2, p.y - 2); ctx.lineTo(p.x - 8, p.y + 8); ctx.stroke();
    }
    if (ratio < 0.33) {
      ctx.beginPath(); ctx.moveTo(p.x + 8, p.y - 12); ctx.lineTo(p.x + 3, p.y); ctx.lineTo(p.x + 10, p.y + 12); ctx.stroke();
    }
  }
}

function drawZombie(z) {
  const s = 1.15, bob = Math.sin(z.phase) * 2;
  const x = z.x, y = z.y + bob;
  const slowed = G.time < z.slowUntil;
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.beginPath(); ctx.ellipse(x, z.y + 34, 18, 6, 0, 0, 7); ctx.fill();
  // 腿
  const step = Math.sin(z.phase) * 5;
  ctx.fillStyle = '#5a5366';
  ctx.fillRect(x - 9, y + 12, 7, 20 + step);
  ctx.fillRect(x + 2, y + 12, 7, 20 - step);
  // 身体
  ctx.fillStyle = '#5d4a7a'; rr(x - 11, y - 10, 22, 26, 6); ctx.fill();
  // 伸出的手臂
  ctx.fillStyle = slowed ? '#8fb7a6' : '#9fb487';
  rr(x + 6, y - 8, 20, 7, 3); ctx.fill();
  rr(x + 6, y + 1, 18, 6, 3); ctx.fill();
  // 头
  ctx.fillStyle = slowed ? '#8fb7a6' : '#a8c090';
  circ(x, y - 18, 11); ctx.fill();
  ctx.strokeStyle = '#5f7549'; ctx.lineWidth = 1.5; ctx.stroke();
  // 眼 + 嘴
  ctx.fillStyle = '#e8e8e8'; circ(x - 4, y - 20, 3.2); circ(x + 4, y - 20, 3.2); ctx.fill();
  ctx.fillStyle = '#a32020'; circ(x - 3.4, y - 20, 1.5); circ(x + 4.6, y - 20, 1.5); ctx.fill();
  ctx.fillStyle = '#3a2a1a'; ctx.fillRect(x - 5, y - 12, 10, 3);
  // 帽子
  if (z.type === 'cone') {
    ctx.fillStyle = '#e08a2e';
    ctx.beginPath(); ctx.moveTo(x, y - 42); ctx.lineTo(x - 12, y - 20); ctx.lineTo(x + 12, y - 20);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#b35f12'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x - 4, y - 36, 3, 12);
  } else if (z.type === 'bucket') {
    ctx.fillStyle = '#9aa3b8';
    ctx.beginPath();
    ctx.moveTo(x - 12, y - 18); ctx.lineTo(x - 9, y - 38); ctx.lineTo(x + 9, y - 38); ctx.lineTo(x + 12, y - 18);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#5d6474'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = '#79828f'; ctx.fillRect(x - 9, y - 28, 18, 3);
  }
  if (z.flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${z.flash * 5})`;
    circ(x, y - 6, 18); ctx.fill();
  }
}

function drawPea(p) {
  const c = p.slow ? '#9fe4ff' : '#c6ed7f';
  const g = ctx.createRadialGradient(p.x - 2, p.y - 2, 1, p.x, p.y, 8);
  g.addColorStop(0, '#fff'); g.addColorStop(0.4, c); g.addColorStop(1, p.slow ? '#3f9ec8' : '#6fb02e');
  ctx.fillStyle = g; circ(p.x, p.y, 7); ctx.fill();
}

function drawSunIcon(x, y, r, t) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(t * 0.8);
  ctx.fillStyle = '#ffcf33';
  for (let i = 0; i < 8; i++) {
    ctx.rotate(Math.PI / 4);
    ctx.beginPath(); ctx.moveTo(0, -r - 5); ctx.lineTo(3, -r + 1); ctx.lineTo(-3, -r + 1);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 2, x, y, r);
  g.addColorStop(0, '#fff6b0'); g.addColorStop(0.6, '#ffdf4d'); g.addColorStop(1, '#f0a91e');
  ctx.fillStyle = g; circ(x, y, r); ctx.fill();
  ctx.strokeStyle = '#d98c12'; ctx.lineWidth = 1.5; ctx.stroke();
}

function drawSuns() {
  for (const s of G.suns) {
    const fade = s.life < 2 ? Math.max(0, s.life / 2) : 1;
    ctx.globalAlpha = fade;
    drawSunIcon(s.x, s.y, 17, G.time + s.x);
    ctx.globalAlpha = 1;
  }
}

function drawMower(m) {
  const x = m.x, y = rowY(m.row) + 18;
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.beginPath(); ctx.ellipse(x, y + 12, 18, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#c93b2e'; rr(x - 14, y - 10, 26, 16, 4); ctx.fill();
  ctx.fillStyle = '#8c2418'; ctx.fillRect(x - 14, y - 2, 26, 3);
  ctx.fillStyle = '#333'; circ(x - 7, y + 7, 5); circ(x + 7, y + 7, 5); ctx.fill();
  ctx.fillStyle = '#bbb'; circ(x + 13, y - 2, 5); ctx.fill();
}

function drawBoom(b) {
  const a = b.life / b.max;
  ctx.globalAlpha = a * 0.85;
  const g = ctx.createRadialGradient(b.x, b.y, 4, b.x, b.y, b.r);
  g.addColorStop(0, '#fff3b0'); g.addColorStop(0.4, '#ff8a2e'); g.addColorStop(1, 'rgba(180,30,10,0)');
  ctx.fillStyle = g; circ(b.x, b.y, b.r); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawParts() {
  for (const p of G.parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color; circ(p.x, p.y, p.r); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.font = 'bold 15px Microsoft YaHei'; ctx.textAlign = 'center';
  for (const f of G.floaters) {
    ctx.globalAlpha = Math.max(0, f.life / 0.8);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawDanger() {
  const a = 0.12 + 0.1 * Math.sin(G.time * 12);
  const g = ctx.createLinearGradient(0, 0, GX + 120, 0);
  g.addColorStop(0, `rgba(220,30,30,${a + 0.15})`); g.addColorStop(1, 'rgba(220,30,30,0)');
  ctx.fillStyle = g; ctx.fillRect(0, GY, GX + 120, ROWS * CH);
}

// ----- 顶部栏 -----
function drawTopBar() {
  const g = ctx.createLinearGradient(0, 0, 0, TOP);
  g.addColorStop(0, '#6b4a27'); g.addColorStop(1, '#4a3119');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, TOP);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, TOP - 6, W, 6);

  // 阳光计数
  rr(10, 8, 74, 70, 8); ctx.fillStyle = '#e8dcc0'; ctx.fill();
  ctx.strokeStyle = '#7a5a2e'; ctx.lineWidth = 2; ctx.stroke();
  drawSunIcon(47, 32, 15, G.time);
  ctx.fillStyle = '#3a2a10'; ctx.font = 'bold 20px Microsoft YaHei';
  ctx.textAlign = 'center'; ctx.fillText(G.sun, 47, 70);

  // 种子卡片
  ORDER.forEach((t, i) => {
    const rc = cardRects[i], def = PDEF[t], cd = G.cooldown[t] || 0;
    const afford = G.sun >= def.cost;
    ctx.fillStyle = '#e8d5a8'; rr(rc.x, rc.y, rc.w, rc.h, 6); ctx.fill();
    ctx.strokeStyle = G.selected === t ? '#ffe066' : '#7a5a2e';
    ctx.lineWidth = G.selected === t ? 3 : 2; ctx.stroke();
    plantShape(t, rc.x + rc.w / 2, rc.y + 30, 0.62, G.time);
    ctx.fillStyle = '#3a2a10'; ctx.font = '11px Microsoft YaHei';
    ctx.fillText(def.name, rc.x + rc.w / 2, rc.y + 56);
    drawSunIcon(rc.x + 14, rc.y + 66, 6, 0);
    ctx.font = 'bold 12px Microsoft YaHei';
    ctx.fillStyle = afford ? '#3a2a10' : '#b23020';
    ctx.textAlign = 'left'; ctx.fillText(def.cost, rc.x + 24, rc.y + 70);
    ctx.textAlign = 'center';
    if (cd > 0) {
      ctx.fillStyle = 'rgba(20,20,30,.6)';
      rr(rc.x, rc.y, rc.w, rc.h * (cd / def.cd), 6); ctx.fill();
    } else if (!afford) {
      ctx.fillStyle = 'rgba(20,20,30,.35)'; rr(rc.x, rc.y, rc.w, rc.h, 6); ctx.fill();
    }
  });

  // 铲子
  ctx.fillStyle = '#caa062'; rr(SHOVEL_RECT.x, SHOVEL_RECT.y, SHOVEL_RECT.w, SHOVEL_RECT.h, 6); ctx.fill();
  ctx.strokeStyle = G.shovel ? '#ffe066' : '#7a5a2e';
  ctx.lineWidth = G.shovel ? 3 : 2; ctx.stroke();
  ctx.save();
  ctx.translate(SHOVEL_RECT.x + 26, SHOVEL_RECT.y + 32); ctx.rotate(-0.5);
  ctx.fillStyle = '#8a5a2b'; ctx.fillRect(-3, -18, 6, 20);
  ctx.fillStyle = '#b9c2cf';
  ctx.beginPath(); ctx.moveTo(-9, 2); ctx.lineTo(9, 2); ctx.lineTo(5, 18); ctx.lineTo(-5, 18);
  ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#6b7484'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.restore();

  // 进度条
  ctx.fillStyle = '#3a2a10'; ctx.font = 'bold 12px Microsoft YaHei'; ctx.textAlign = 'left';
  ctx.fillText('僵尸来袭进度', BAR.x, BAR.y - 8);
  ctx.fillStyle = '#7a5a2e'; rr(BAR.x, BAR.y, BAR.w, BAR.h, 9); ctx.fill();
  for (const [ft, label, color] of [[FLAG_T, '⚑', '#e8e8e8'], [FINAL_T, '⚑', '#ff5a4a']]) {
    const fx = BAR.x + BAR.w * Math.min(1, ft / FINAL_T);
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(fx, BAR.y - 4); ctx.lineTo(fx, BAR.y + BAR.h + 4); ctx.stroke();
    ctx.fillStyle = color; ctx.font = '13px Microsoft YaHei'; ctx.textAlign = 'center';
    ctx.fillText(label, fx, BAR.y - 6);
  }
  const pct = Math.min(1, G.time / FINAL_T);
  ctx.fillStyle = '#6fbf3a'; rr(BAR.x + 2, BAR.y + 2, (BAR.w - 4) * pct, BAR.h - 4, 7); ctx.fill();
  // 僵尸头标记
  const zx = BAR.x + 3 + (BAR.w - 6) * pct;
  ctx.fillStyle = '#a8c090'; circ(zx, BAR.y + BAR.h / 2, 6); ctx.fill();
  ctx.fillStyle = '#a32020'; ctx.fillRect(zx - 3, BAR.y + BAR.h / 2 - 3, 2, 2);
  ctx.fillRect(zx + 1, BAR.y + BAR.h / 2 - 3, 2, 2);
  ctx.textAlign = 'left';
}

// ----- 覆盖层 -----
function drawOverlay() {
  ctx.fillStyle = 'rgba(10,20,8,.72)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  if (G.state === 'ready') {
    ctx.fillStyle = '#ffe98a'; ctx.font = 'bold 46px Microsoft YaHei';
    ctx.fillText('植物大战僵尸', W / 2, 160);
    ctx.fillStyle = '#d8ecbd'; ctx.font = '16px Microsoft YaHei';
    const lines = [
      '收集天上掉下来的阳光，种植物守住你的草坪！',
      '🌻 向日葵产阳光　🌱 豌豆射手射击　❄ 寒冰射手减速',
      '🥜 坚果墙阻挡　🍒 樱桃炸弹范围清场',
      '僵尸会越来越强，扛过最终大波即获胜，每行有一台小推车兜底。',
    ];
    lines.forEach((t, i) => ctx.fillText(t, W / 2, 230 + i * 34));
    drawButton(W / 2 - 110, 402, 220, 54, '开始游戏');
  } else {
    const win = G.state === 'won';
    ctx.fillStyle = win ? '#b8f279' : '#ff8a7a';
    ctx.font = 'bold 54px Microsoft YaHei';
    ctx.fillText(win ? '🎉  lawn saved  🎉' : '🧟 僵尸吃掉了你的脑子！', W / 2, 250);
    ctx.font = '20px Microsoft YaHei'; ctx.fillStyle = '#e6f2d6';
    ctx.fillText(win ? `用时 ${Math.round(G.time)} 秒击退全部僵尸` : `坚守了 ${Math.round(G.time)} 秒`, W / 2, 310);
    drawButton(W / 2 - 110, 380, 220, 54, '再来一局');
  }
}
function drawButton(x, y, w, h, text) {
  const hov = inRect(G.hover.x, G.hover.y, { x, y, w, h });
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, hov ? '#ffd85e' : '#f4b73f'); g.addColorStop(1, hov ? '#e9a52e' : '#cf8f22');
  ctx.fillStyle = g; rr(x, y, w, h, 14); ctx.fill();
  ctx.strokeStyle = '#7a4f12'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#402808'; ctx.font = 'bold 24px Microsoft YaHei'; ctx.textAlign = 'center';
  ctx.fillText(text, x + w / 2, y + h / 2 + 8);
}

// ---------- 主循环 ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
initGame();
requestAnimationFrame(loop);
})();
</script>
</body>
